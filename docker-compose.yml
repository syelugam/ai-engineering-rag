version: "3.8"

# Local development database: Postgres 16 with the pgvector extension.
# Start:  docker compose up -d      (older Docker: docker-compose up -d)
# Stop:   docker compose down       (data survives in the pgdata volume)
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5433:5432"   # 5433 on your Mac, so it can't clash with another Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
